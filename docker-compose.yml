version: "3.9"

services:
  android-emulator:
    image: budtmo/docker-android:emulator_11.0
    container_name: android_emulator
    privileged: true
    ports:
      - "6080:6080"   # Web VNC
      - "5555:5555"   # ADB
    environment:
      - DEVICE=Pixel_4
      - WEB_VNC=true
      - APPIUM=false
    volumes:
      - android-data:/root/.android
    restart: unless-stopped

volumes:
  android-data:
